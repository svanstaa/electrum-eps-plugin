name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed by action-gh-release to attach the zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The plugin targets Electrum protocol 1.7, which no released Electrum
      # speaks yet; pin the branch that does instead of tracking master.
      - name: Clone Electrum (for make_plugin)
        run: |
          git clone --depth=1 --branch protocol_1.7 https://github.com/spesmilo/electrum

      - name: Build plugin zip
        run: |
          cd electrum
          pip install -r contrib/requirements/requirements.txt cryptography
          ./contrib/make_plugin ../eps

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: eps-*.zip
